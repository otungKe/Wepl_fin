name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wepl
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_USER: wepl_app  # not a superuser, so row-level security applies (ADR-0009)
      DB_PASSWORD: wepl
      WEPL_PROPERTY_EXAMPLES: "150"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Create the application database role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE wepl_app LOGIN PASSWORD 'wepl' CREATEDB NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "ALTER DATABASE wepl OWNER TO wepl_app"
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py test -v 2
        working-directory: backend
      - name: Run the custody demo end to end
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py demo_custody_pilot
      - name: Restore drill (back up, restore, prove the copy is identical and works)
        working-directory: backend
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: scripts/restore_drill.sh wepl
